        <script>
            // The page displays Markdown through the existing LiaScript viewer.
            // Edit contents.md or files in lectures/, not this HTML.
            // LiaScript expects the course URL itself after "?", not ?file=....
            (function () {
                var requested = window.location.search.slice(1);
                var course = "contents.md";
                var siteFolder = new URL(".", window.location.href);
                var lectureFolder = new URL("lectures/", siteFolder);
                try {
                    requested = decodeURIComponent(requested);
                    // Also accept absolute course URLs generated by LiaScript.
                    var requestedURL = new URL(requested, siteFolder);
                    var filename = requestedURL.pathname.split("/").pop().toLowerCase();
                    var folder = new URL(".", requestedURL).href;
                    var lecture = /^lecture(\d{2,})\.md$/.exec(filename);

                    if (requested && lecture && Number(lecture[1]) > 0 &&
                        (folder === lectureFolder.href || folder === siteFolder.href)) {
                        // Legacy ?Lecture01.md links select the new folder too.
                        // Future lecture12.md, lecture13.md, etc. need no HTML edit.
                        course = "lectures/" + filename;
                    }
                } catch (error) {
                    // Invalid links return to the contents page.
                }

                var courseURL = new URL(course, siteFolder);
                window.LIA = window.LIA || {};
                window.LIA.defaultCourseURL = courseURL.href;

                // Normalize the URL for LiaScript's course/asset resolution.
                // Keep slide hashes so bookmarks still open the selected slide.
                window.history.replaceState(null, "",
                    window.location.pathname + "?" + courseURL.href + window.location.hash);
            }());
        </script>
